name: Basic checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check js/main.js

      - name: Validate HTML
        run: npx --yes html-validate index.html

      - name: Check local asset references and anchors
        run: node .github/scripts/check-links.js
